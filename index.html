<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACES Consortium</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
    }

    header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      padding: 0 20px;
      background: #111;
      color: white;
      font-size: 14px;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .join-link {
      font-weight: 600;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 44px);
      border: 0;
      background: white;
    }

    @media (max-width: 600px) {
      header {
        gap: 14px;
        padding: 0 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="mailto:contact@aces-iot.org">
      info@aces-consortium.org
    </a>

    <a
      class="join-link"
      href="https://forms.gle/AHRyF8r9wquhLAK77"
      target="_blank"
      rel="noopener noreferrer">
      Join the Consortium
    </a>
  </header>

  <iframe
    src="/ACES-Consortium-Overview.pdf"
    title="ACES Consortium Overview">
  </iframe>

</body>
</html>
